<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EdTech, mini plateforme de cours en ligne : cours, progression, quiz.">
    <title>EdTech — Apprends. Pratique. Progresse.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lms.css">
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#view">Aller au contenu</a>

    <div class="app">

        <!-- Menu latéral : liens de la SPA (hash routing) -->
        <aside class="sidebar" id="sidebar">
            <a href="#/" class="logo">
                <span class="logo-icon">ET</span>
                <span>Ed<span class="logo-light">Tech</span></span>
            </a>

            <p class="menu-label">ESPACE APPRENANT</p>

            <nav class="navigation" aria-label="Navigation principale">
                <a href="#/" class="nav-link" data-nav="#/"><span aria-hidden="true">⌂</span> Accueil</a>
                <a href="#/cours" class="nav-link" data-nav="#/cours"><span aria-hidden="true">▤</span> Mes cours</a>
                <a href="#/progression" class="nav-link" data-nav="#/progression"><span aria-hidden="true">◷</span> Ma progression</a>
                <a href="#/admin" class="nav-link" data-nav="#/admin"><span aria-hidden="true">⚙</span> Administration</a>
            </nav>

            <div class="sidebar-bottom">
                <div class="sidebar-note">
                    <span class="note-icon" aria-hidden="true">✦</span>
                    <p class="note-title">Continue à apprendre !</p>
                    <p>Chaque leçon te rapproche de ton objectif.</p>
                </div>
                <p class="sidebar-footer">© 2026 EdTech</p>
            </div>
        </aside>

        <main class="main-content" id="main" tabindex="-1">

            <header class="topbar">
                <button class="icon-button burger" id="burger" type="button"
                        aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">☰</button>

                <label class="search-box">
                    <span aria-hidden="true">⌕</span>
                    <input type="search" id="search" placeholder="Rechercher un cours..."
                           aria-label="Rechercher un cours" autocomplete="off">
                    <kbd>Ctrl K</kbd>
                </label>

                <div class="profile">
                    <div class="avatar" aria-hidden="true">É</div>
                    <div class="profile-text">
                        <strong>Mon espace</strong>
                        <span>Apprenante</span>
                    </div>
                </div>
            </header>

            <!-- La vue courante est injectée ici par app.js (sans rechargement) -->
            <div class="page-content" id="view"></div>
        </main>
    </div>

    <noscript><p class="noscript">Cette plateforme nécessite JavaScript.</p></noscript>
</body>
</html>
